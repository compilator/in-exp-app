<h1>Редактирование дохода</h1>
<div class="content-inner">
    <div class="operation-form-wrapper">
        <form class="operation-form">
            <input type="hidden" id="type" value="income">
            <div class="mb-3">
                <label class="form-label" for="category">Категория</label>
                <select id="category" class="form-control" required></select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="amount">Сумма</label>
                <input type="number" step="0.01" class="form-control" id="amount" placeholder="Сумма" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="date">Дата</label>
                <input type="date" class="form-control" id="date" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="comment">Комментарий</label>
                <input type="text" class="form-control" id="comment" placeholder="Комментарий">
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-create">Сохранить</button>
                <button type="button" class="btn btn-cancel" onclick="window.router && window.router.navigate('/operations')">Отмена</button>
            </div>
        </form>
    </div>
</div>
