<h1>Доходы и расходы</h1>
<div class="buttons mb-3">
    <button type="button" class="btn btn-confirm-yes" onclick="window.router && window.router.navigate('/income/add')">Создать доход</button>
    <button type="button" class="btn btn-confirm-no" onclick="window.router && window.router.navigate('/expense/add')">Создать расход</button>
</div>
<div class="buttons js-period-filters mb-3">
    <button class="btn btn-secondary js-period-btn" type="button" data-period="today">Сегодня</button>
    <button class="btn btn-outline-secondary js-period-btn" type="button" data-period="week">Неделя</button>
    <button class="btn btn-outline-secondary js-period-btn" type="button" data-period="month">Месяц</button>
    <button class="btn btn-outline-secondary js-period-btn" type="button" data-period="year">Год</button>
    <button class="btn btn-outline-secondary js-period-btn" type="button" data-period="all">Все</button>
    <button class="btn btn-outline-secondary js-period-btn" type="button" data-period="interval">Интервал</button>
    <span class="js-interval-dates interval-dates d-none">
        с <input type="date" class="date js-date-from" aria-label="Дата с">
        по <input type="date" class="date js-date-to" aria-label="Дата по">
    </span>
</div>
<div class="content-inner">
    <table class="operations-table">
        <thead>
            <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Сумма</th>
                <th>Комментарий</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="modal fade modal-confirm" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body"><p class="mb-0">Вы действительно хотите удалить операцию?</p></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-confirm-yes" id="confirmDeleteBtn">Да, удалить</button>
                <button type="button" class="btn btn-confirm-no" data-bs-dismiss="modal">Не удалять</button>
            </div>
        </div>
    </div>
</div>
