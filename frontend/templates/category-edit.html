<h1 id="category-edit-heading">Категория</h1>
<div class="content-inner">
    <div class="operation-form-wrapper">
        <form class="js-category-edit-form">
            <div class="mb-3">
                <label class="form-label" for="categoryTitle">Название</label>
                <input type="text" class="form-control" id="categoryTitle" required maxlength="120" autocomplete="off">
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-create">Сохранить</button>
                <button type="button" class="btn btn-cancel" id="categoryEditCancel">Отмена</button>
            </div>
        </form>
    </div>
</div>
